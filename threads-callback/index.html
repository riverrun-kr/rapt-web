<script>
  // Meta OAuth는 HTTPS redirect_uri만 허용해 여기로 먼저 돌아온다. 이 페이지는
  // 쿼리스트링(code/state)을 그대로 커스텀 스킴에 실어 Rapt 앱으로 넘기기만
  // 한다 — ASWebAuthenticationSession이 이 리디렉션을 가로채므로 앱 쪽에서
  // 별도 서버 처리가 필요 없다(Rapt/ThreadsAuth.swift 참고).
  window.location.replace("rapt://threads-auth" + window.location.search);
</script>
